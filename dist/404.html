    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <title>TalkIO</title>
    <!-- Aplica la apariencia elegida antes de pintar (ver src/stores/appearanceStore.ts) -->
    <script>
      // y el fondo de página (landing liso, app agrupado; ver src/lib/surface.ts) para que Safari
      // pinte la zona de la Dynamic Island y la barra de la URL del mismo color desde el inicio
      try {
        var plain = location.pathname === '/'
        if (plain) document.documentElement.dataset.surface = 'plain'
        var colors = plain ? { light: '#ffffff', dark: '#000000' } : { light: '#f5f5f7', dark: '#161617' }
        var t = localStorage.getItem('talkio-appearance')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          var scheme = t === 'light' || t === 'dark' ? t : m.media.indexOf('dark') >= 0 ? 'dark' : 'light'
          m.content = colors[scheme]
        })
      } catch (e) {}
    </script>
