<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Aprende inglés a partir de tus propios errores: lecciones a tu nivel, repaso espaciado y racha diaria." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
    />
    <title>TalkIO</title>
    <!-- Aplica la apariencia elegida antes de pintar (ver src/stores/appearanceStore.ts) -->
    <script>
      try {
        var t = localStorage.getItem('talkio-appearance')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === 'dark' ? '#000000' : '#ffffff'
          })
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/assets/index-BTkINdLk.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/cn-DNK7aqWt.js">
    <link rel="stylesheet" crossorigin href="/assets/index-ShdH9WdP.css">
  </head>

  </body>
</html>
